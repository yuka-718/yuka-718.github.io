<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <title>Yuka Ito</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      position: relative;
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        linear-gradient(160deg, #fff7ff 0%, #f2eeff 38%, #e9fff8 72%, #fff9dc 100%);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      color: #111;
      overflow: hidden;
    }

    body::before {
      content: "✦     ✧        ✦   ✧       ✦      ✧";
      position: fixed;
      inset: 7vh 0 auto 0;
      color: rgba(181, 139, 255, .35);
      font-size: clamp(22px, 3.2vw, 46px);
      letter-spacing: .85em;
      line-height: 1;
      text-align: center;
      pointer-events: none;
      animation: twinkle 3.8s ease-in-out infinite;
    }

    .stage {
      position: relative;
      width: min(720px, calc(100vw - 40px), calc((100vh - 40px) * 1.08));
      height: min(667px, calc((100vw - 40px) * 0.9259), calc(100vh - 40px));
      display: grid;
      place-items: center;
      padding: 0;
      overflow: hidden;
      filter: drop-shadow(0 28px 46px rgba(168, 118, 232, .22));
      transform: scaleX(0.04) scaleY(0.02);
      animation: openStage 900ms cubic-bezier(.2, .9, .2, 1) forwards;
    }

    .window {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      min-height: 0;
      position: relative;
      overflow: hidden;
      background: linear-gradient(135deg, #8bdfff 0%, #b895ff 46%, #ff8ed4 100%);
      border-radius: clamp(18px, 2.2vw, 32px);
      padding: clamp(12px, 1.9vmin, 24px);
    }

    .window::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(115deg, rgba(255, 255, 255, .42) 0 13%, transparent 13% 26%, rgba(255, 255, 255, .24) 26% 34%, transparent 34% 100%);
      opacity: .42;
      pointer-events: none;
      transform: translateX(-18%);
      animation: dreamSheen 5.8s ease-in-out infinite;
    }

    .dots {
      position: relative;
      z-index: 1;
      display: flex;
      gap: clamp(7px, 1.1vmin, 12px);
      flex: 0 0 auto;
      margin-bottom: clamp(10px, 1.8vmin, 22px);
    }

    .dot {
      width: clamp(14px, 2.6vmin, 28px);
      height: clamp(14px, 2.6vmin, 28px);
      border-radius: 50%;
      animation: bounce 1.4s ease-in-out infinite;
    }

    .dot:nth-child(2) {
      animation-delay: .15s;
    }

    .dot:nth-child(3) {
      animation-delay: .3s;
    }

    .pink { background: #ff75bb; }
    .yellow { background: #ffe57d; }
    .blue { background: #72eadb; }

    .code {
      position: relative;
      z-index: 1;
      flex: 1;
      margin: 0;
      background: rgba(255, 255, 255, .94);
      border-radius: clamp(16px, 2vw, 30px);
      padding: clamp(12px, 2.2vmin, 28px);
      min-height: 0;
      font-family: inherit;
      font-size: clamp(14px, min(3.25vw, 4.3vh), 32px);
      line-height: 1.18;
      white-space: pre;
      overflow: hidden;
      box-shadow:
        inset 0 0 0 1px rgba(255, 255, 255, .72),
        0 14px 30px rgba(129, 100, 239, .13);
    }

    .kw { color: #7c82ff; }
    .name { color: #ff8a58; }
    .str { color: #48c982; }

    .cursor {
      display: inline-block;
      width: .55em;
      height: 1em;
      margin-left: 2px;
      background: #111;
      vertical-align: -0.12em;
      animation: blink .75s steps(1) infinite;
    }

    @keyframes openStage {
      0% {
        transform: scaleX(0.04) scaleY(0.02);
        border-radius: 999px;
      }
      55% {
        transform: scaleX(1) scaleY(0.04);
        border-radius: 999px;
      }
      100% {
        transform: scaleX(1) scaleY(1);
        border-radius: 0;
      }
    }

    @keyframes bounce {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-7px);
      }
    }

    @keyframes dreamSheen {
      0%, 100% {
        transform: translateX(-18%);
        opacity: .34;
      }
      50% {
        transform: translateX(12%);
        opacity: .56;
      }
    }

    @keyframes twinkle {
      0%, 100% {
        opacity: .42;
        transform: translateY(0);
      }
      50% {
        opacity: .72;
        transform: translateY(-7px);
      }
    }

    @keyframes blink {
      50% {
        opacity: 0;
      }
    }

    @media (max-width: 700px) {
      body {
        overflow: auto;
      }

      body::before {
        inset: 18vh 0 auto 0;
        font-size: 18px;
        letter-spacing: .45em;
      }

      .stage {
        width: min(calc(100vw - 14px), calc((100vh - 14px) * 1.08));
        height: min(calc((100vw - 14px) * 0.9259), calc(100vh - 14px));
      }

      .window {
        border-radius: 16px;
        padding: 7px;
      }

      .dots {
        gap: 5px;
        margin-bottom: 8px;
      }

      .dot {
        width: 10px;
        height: 10px;
      }

      .code {
        border-radius: 14px;
        padding: 8px;
        font-size: clamp(7px, min(2.2vw, 1.35vh), 10px);
        line-height: 1.2;
      }
    }
  </style>
</head>

<body>
  <main class="stage">
    <section class="window" aria-label="Profile window">
      <div class="dots" aria-hidden="true">
        <span class="dot pink"></span>
        <span class="dot yellow"></span>
        <span class="dot blue"></span>
      </div>

      <pre class="code" id="code" aria-label="Profile code"></pre>
    </section>
  </main>

  <script>
    const code = document.getElementById("code");

    const parts = [
      ["class", "kw"], [" ", ""], ["Profile", "name"], [":\n\n", ""],
      ["  def", "kw"], [" ", ""], ["__init__", "name"], ["(self):\n", ""],
      ["    self.name = ", ""], ['"Yuka Ito"', "str"], ["\n", ""],
      ["    self.birth_date = ", ""], ['"2008/7/18"', "str"], ["\n", ""],
      ["    self.blood_type = ", ""], ['"O"', "str"], ["\n", ""],
      ["    self.other = [\n", ""],
      ["      ", ""], ['"未踏ジュニア2026"', "str"], ["\n", ""],
      ["      ", ""], ['"情報科学の達人6期生"', "str"], ["\n", ""],
      ["    ]\n\n", ""],
      ["me = Profile()", ""]
    ];

    const cursor = document.createElement("span");
    cursor.className = "cursor";

    let partIndex = 0;
    let charIndex = 0;
    let currentSpan = null;

    function makeSpan(className) {
      const span = document.createElement("span");
      if (className) span.className = className;
      code.insertBefore(span, cursor);
      return span;
    }

    function typeCode() {
      if (!cursor.parentNode) code.appendChild(cursor);

      if (partIndex >= parts.length) return;

      const text = parts[partIndex][0];
      const className = parts[partIndex][1];

      if (!currentSpan) currentSpan = makeSpan(className);

      currentSpan.textContent += text[charIndex];
      charIndex += 1;

      if (charIndex >= text.length) {
        partIndex += 1;
        charIndex = 0;
        currentSpan = null;
      }

      const delay = text[charIndex - 1] === "\n" ? 90 : 22;
      setTimeout(typeCode, delay);
    }

    setTimeout(typeCode, 1250);
  </script>
</body>
</html>
