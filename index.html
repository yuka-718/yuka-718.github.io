<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <title>Yuka Ito</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      position: relative;
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        linear-gradient(160deg, #fff7ff 0%, #f2eeff 38%, #e9fff8 72%, #fff9dc 100%);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      color: #111;
      overflow: hidden;
    }

    body::before {
      content: "✦     ✧        ✦   ✧       ✦      ✧";
      position: fixed;
      inset: 7vh 0 auto 0;
      z-index: 0;
      color: rgba(181, 139, 255, .35);
      font-size: clamp(22px, 3.2vw, 46px);
      letter-spacing: .85em;
      line-height: 1;
      text-align: center;
      pointer-events: none;
      animation: twinkle 3.8s ease-in-out infinite;
    }

    .stage {
      position: relative;
      z-index: 2;
      width: calc(100vw - 40px);
      height: min(667px, calc(100vh - 40px));
      display: grid;
      place-items: center;
      padding: 0;
      overflow: visible;
      filter: drop-shadow(0 28px 46px rgba(168, 118, 232, .22));
      transform: scaleX(0.04) scaleY(0.02);
      animation: openStage 900ms cubic-bezier(.2, .9, .2, 1) forwards;
    }

    .unicorn-field {
      position: fixed;
      inset: 0;
      z-index: 4;
      overflow: hidden;
      pointer-events: none;
    }

    .mobile-social {
      display: none;
    }

    .unicorn {
      position: absolute;
      left: 0;
      top: 0;
      display: grid;
      place-items: center;
      width: calc(var(--size) * 1.62);
      height: var(--size);
      opacity: .94;
      filter:
        drop-shadow(0 14px 18px rgba(181, 139, 255, .25))
        drop-shadow(0 0 20px rgba(255, 142, 212, .32));
      transform:
        translate3d(var(--x, 72vw), var(--y, 12vh), 0)
        rotate(var(--tilt, -4deg))
        scale(var(--scale, 1));
      transition: transform var(--move-duration, 1800ms) cubic-bezier(.34, .02, .2, 1);
      will-change: transform;
    }

    .unicorn-pony {
      position: relative;
      z-index: 1;
      display: block;
      width: 100%;
      height: 100%;
      transform-origin: center;
      animation: unicornBob 2.7s ease-in-out infinite;
    }

    .unicorn-sprite {
      position: relative;
      display: block;
      width: 100%;
      height: 100%;
      overflow: hidden;
      transform: scaleX(var(--face, 1));
      transition: transform .28s ease;
    }

    .unicorn-sprite::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 400%;
      height: 100%;
      background: url("assets/unicorn-flight.png") 0 0 / 100% 100% no-repeat;
      will-change: transform;
      animation: unicornFrame .92s steps(4) infinite;
    }

    .unicorn.u1 {
      --size: clamp(112px, 13vmin, 172px);
    }

    .window {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      min-height: 0;
      position: relative;
      overflow: hidden;
      z-index: 3;
      background: linear-gradient(135deg, #8bdfff 0%, #b895ff 46%, #ff8ed4 100%);
      border-radius: clamp(18px, 2.2vw, 32px);
      padding: clamp(12px, 1.9vmin, 24px);
    }

    .window::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(115deg, rgba(255, 255, 255, .42) 0 13%, transparent 13% 26%, rgba(255, 255, 255, .24) 26% 34%, transparent 34% 100%);
      opacity: .42;
      pointer-events: none;
      transform: translateX(-18%);
      animation: dreamSheen 5.8s ease-in-out infinite;
    }

    .mini-window {
      position: absolute;
      z-index: 5;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, .72);
      border-radius: 22px;
      background: rgba(255, 255, 255, .52);
      color: rgba(65, 50, 92, .72);
      text-decoration: none;
      box-shadow:
        0 18px 34px rgba(153, 113, 232, .17),
        inset 0 0 24px rgba(255, 255, 255, .56);
      backdrop-filter: blur(16px);
      cursor: none;
      opacity: 0;
      transform: translateY(18px) scale(.95);
      animation:
        floatIn 720ms cubic-bezier(.2, .9, .2, 1) 860ms forwards,
        drift 5.2s ease-in-out 1.7s infinite;
    }

    .mini-window:focus-visible {
      outline: 3px solid rgba(255, 117, 187, .62);
      outline-offset: 5px;
    }

    .mini-window::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 20% 18%, rgba(255, 255, 255, .8), transparent 18%),
        radial-gradient(circle at 84% 72%, rgba(255, 142, 212, .22), transparent 28%),
        linear-gradient(135deg, rgba(139, 223, 255, .38), rgba(255, 142, 212, .22));
      pointer-events: none;
    }

    .mini-window.left {
      left: auto;
      right: 28px;
      top: 22px;
      width: 245px;
      height: 176px;
      rotate: -5deg;
    }

    .mini-window.right {
      right: 28px;
      top: auto;
      bottom: 24px;
      width: 212px;
      height: 132px;
      rotate: 4deg;
      animation-delay: 980ms, 1.9s;
    }

    .mini-window.top {
      right: 28px;
      top: 218px;
      width: 206px;
      height: 116px;
      rotate: 8deg;
      animation-delay: 1080ms, 2.15s;
    }

    .mini-window.bottom {
      left: auto;
      right: 28px;
      top: 356px;
      bottom: auto;
      width: 202px;
      height: 112px;
      rotate: -8deg;
      animation-delay: 1180ms, 2.35s;
    }

    .mini-bar,
    .mini-content {
      position: relative;
      z-index: 1;
    }

    .mini-bar {
      display: flex;
      gap: 7px;
      padding: 13px 15px 9px;
    }

    .mini-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    .mini-content {
      margin: 0;
      padding: 4px 17px 16px;
      font-size: 15px;
      line-height: 1.35;
      white-space: normal;
    }

    .social-title {
      display: block;
      margin-bottom: 5px;
      color: #ff75bb;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .04em;
    }

    .social-handle {
      display: block;
      color: #6f77ff;
      font-size: 13px;
      font-weight: 800;
      overflow-wrap: break-word;
    }

    .social-note {
      display: block;
      margin-top: 7px;
      color: rgba(65, 50, 92, .58);
      font-size: 12px;
    }

    .mini-window.x .social-title {
      color: #6f77ff;
    }

    .mini-window:hover .social-handle,
    .mini-window:focus-visible .social-handle {
      color: #ff75bb;
    }

    .mobile-social-card {
      min-width: 0;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, .72);
      border-radius: 16px;
      background:
        radial-gradient(circle at 20% 16%, rgba(255, 255, 255, .85), transparent 18%),
        linear-gradient(135deg, rgba(139, 223, 255, .58), rgba(255, 142, 212, .36));
      color: rgba(65, 50, 92, .74);
      text-decoration: none;
      box-shadow:
        0 12px 24px rgba(153, 113, 232, .14),
        inset 0 0 20px rgba(255, 255, 255, .54);
      backdrop-filter: blur(16px);
    }

    .mobile-social-card:focus-visible {
      outline: 3px solid rgba(255, 117, 187, .62);
      outline-offset: 3px;
    }

    .mobile-social-dots {
      display: flex;
      gap: 5px;
      padding: 8px 10px 4px;
    }

    .mobile-social-dots span {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .mobile-social-copy {
      display: block;
      padding: 0 10px 10px;
      line-height: 1.15;
    }

    .mobile-social-title {
      display: block;
      color: #ff75bb;
      font-size: 10px;
      font-weight: 800;
    }

    .mobile-social-handle {
      display: block;
      margin-top: 3px;
      color: #6f77ff;
      font-size: 9px;
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    .mobile-social-card.x .mobile-social-title {
      color: #6f77ff;
    }

    .dots {
      position: relative;
      z-index: 1;
      display: flex;
      gap: clamp(7px, 1.1vmin, 12px);
      flex: 0 0 auto;
      margin-bottom: clamp(10px, 1.8vmin, 22px);
    }

    .dot {
      width: clamp(14px, 2.6vmin, 28px);
      height: clamp(14px, 2.6vmin, 28px);
      border-radius: 50%;
      animation: bounce 1.4s ease-in-out infinite;
    }

    .dot:nth-child(2) {
      animation-delay: .15s;
    }

    .dot:nth-child(3) {
      animation-delay: .3s;
    }

    .pink { background: #ff75bb; }
    .yellow { background: #ffe57d; }
    .blue { background: #72eadb; }

    .code {
      position: relative;
      z-index: 1;
      flex: 1;
      margin: 0;
      background:
        radial-gradient(circle at 16% 18%, rgba(255, 117, 187, .13), transparent 24%),
        radial-gradient(circle at 86% 20%, rgba(114, 234, 219, .15), transparent 25%),
        radial-gradient(circle at 50% 100%, rgba(184, 149, 255, .13), transparent 34%),
        linear-gradient(135deg, rgba(255, 255, 255, .97), rgba(255, 249, 255, .95) 55%, rgba(242, 255, 253, .92));
      border-radius: clamp(16px, 2vw, 30px);
      padding: clamp(12px, 2.2vmin, 28px);
      min-height: 0;
      font-family: inherit;
      font-size: clamp(14px, min(3.25vw, 4.3vh), 32px);
      line-height: 1.18;
      color: #6d5b93;
      font-weight: 700;
      white-space: pre;
      overflow: hidden;
      text-shadow: 0 0 11px rgba(255, 255, 255, .84);
      box-shadow:
        inset 0 0 0 1px rgba(255, 255, 255, .72),
        0 14px 30px rgba(129, 100, 239, .13);
    }

    .code span {
      position: relative;
      z-index: 1;
    }

    .plain {
      color: #6d5b93;
    }

    .kw {
      color: #8b8cff;
      text-shadow:
        0 0 9px rgba(139, 140, 255, .28),
        0 0 16px rgba(255, 255, 255, .82);
    }

    .name {
      color: #ff78b7;
      text-shadow:
        0 0 9px rgba(255, 120, 183, .24),
        0 0 16px rgba(255, 255, 255, .82);
    }

    .str {
      color: #35c7b6;
      text-shadow:
        0 0 9px rgba(53, 199, 182, .25),
        0 0 16px rgba(255, 255, 255, .82);
    }

    .cursor {
      display: inline-block;
      width: .55em;
      height: 1em;
      margin-left: 2px;
      background: linear-gradient(180deg, #ff75bb, #b895ff 54%, #72eadb);
      border-radius: .12em;
      box-shadow:
        0 0 8px rgba(255, 117, 187, .38),
        0 0 14px rgba(114, 234, 219, .34);
      vertical-align: -0.12em;
      animation: blink .75s steps(1) infinite;
    }

    .magic-cursor {
      position: fixed;
      left: 0;
      top: 0;
      z-index: 30;
      width: 48px;
      height: 50px;
      opacity: 0;
      pointer-events: none;
      transform: translate(-4px, -4px) rotate(-8deg);
      transition: opacity .18s ease;
      filter:
        drop-shadow(0 6px 7px rgba(126, 95, 227, .25))
        drop-shadow(0 0 13px rgba(255, 142, 212, .46));
    }

    .magic-cursor::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, #ff7cd8 0%, #9a82ff 45%, #72eadb 100%);
      clip-path: polygon(0 0, 0 82%, 25% 61%, 42% 100%, 58% 94%, 43% 57%, 78% 57%);
    }

    .cursor-sparkle,
    .unicorn-sparkle {
      position: fixed;
      z-index: 29;
      width: var(--spark-size, 12px);
      height: var(--spark-size, 12px);
      color: var(--spark-color, #ff8ed4);
      font-size: var(--spark-size, 12px);
      line-height: 1;
      pointer-events: none;
      transform: translate(-50%, -50%);
      text-shadow:
        0 0 8px currentColor,
        0 0 18px rgba(255, 255, 255, .88);
    }

    .cursor-sparkle::before,
    .unicorn-sparkle::before {
      content: "✦";
      position: absolute;
      inset: 0;
    }

    .cursor-sparkle {
      animation: cursorSpark 720ms ease-out forwards;
    }

    .unicorn-sparkle {
      z-index: 3;
      opacity: .68;
      animation: unicornSpark 1380ms ease-out forwards;
    }

    @keyframes openStage {
      0% {
        transform: scaleX(0.04) scaleY(0.02);
        border-radius: 999px;
      }
      55% {
        transform: scaleX(1) scaleY(0.04);
        border-radius: 999px;
      }
      100% {
        transform: scaleX(1) scaleY(1);
        border-radius: 0;
      }
    }

    @keyframes bounce {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-7px);
      }
    }

    @keyframes unicornBob {
      0%, 100% {
        transform: translateY(0) rotate(-3deg);
      }
      50% {
        transform: translateY(-12%) rotate(4deg);
      }
    }

    @keyframes unicornFrame {
      to {
        transform: translateX(-100%);
      }
    }

    @keyframes floatIn {
      to {
        opacity: .96;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes drift {
      0%, 100% {
        translate: 0 0;
      }
      50% {
        translate: 0 -9px;
      }
    }

    @keyframes dreamSheen {
      0%, 100% {
        transform: translateX(-18%);
        opacity: .34;
      }
      50% {
        transform: translateX(12%);
        opacity: .56;
      }
    }

    @keyframes twinkle {
      0%, 100% {
        opacity: .42;
        transform: translateY(0);
      }
      50% {
        opacity: .72;
        transform: translateY(-7px);
      }
    }

    @keyframes cursorSpark {
      0% {
        opacity: .9;
        transform: translate(-50%, -50%) translate(0, 0) scale(.72) rotate(0deg);
      }
      to {
        opacity: 0;
        transform: translate(-50%, -50%) translate(var(--spark-x, -16px), var(--spark-y, -20px)) scale(.08) rotate(var(--spark-spin, 110deg));
      }
    }

    @keyframes unicornSpark {
      0% {
        opacity: .72;
        transform: translate(-50%, -50%) translate(0, 0) scale(.78) rotate(0deg);
      }
      to {
        opacity: 0;
        transform: translate(-50%, -50%) translate(var(--spark-x, 44px), var(--spark-y, -18px)) scale(.12) rotate(var(--spark-spin, 180deg));
      }
    }

    @keyframes blink {
      50% {
        opacity: 0;
      }
    }

    @media (hover: hover) and (pointer: fine) {
      body {
        cursor: none;
      }
    }

    @media (max-width: 700px) {
      body {
        overflow: auto;
      }

      body::before {
        inset: 18vh 0 auto 0;
        font-size: 18px;
        letter-spacing: .45em;
      }

      .unicorn.u1 {
        --size: clamp(78px, 24vw, 106px);
      }

      .stage {
        width: min(calc(100vw - 14px), calc((100vh - 14px) * 1.08));
        height: min(calc((100vw - 14px) * 0.9259), calc(100vh - 14px));
        overflow: hidden;
      }

      .window {
        width: 100%;
        border-radius: 16px;
        padding: 7px;
      }

      .mini-window,
      .magic-cursor {
        display: none;
      }

      .mobile-social {
        position: fixed;
        left: 10px;
        top: 12px;
        right: 10px;
        z-index: 8;
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: 8px;
      }

      .dots {
        gap: 5px;
        margin-bottom: 8px;
      }

      .dot {
        width: 10px;
        height: 10px;
      }

      .code {
        border-radius: 14px;
        padding: 8px;
        font-size: clamp(7px, min(2.2vw, 1.35vh), 10px);
        line-height: 1.2;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .unicorn,
      .unicorn-pony,
      .unicorn-sprite::before,
      .cursor-sparkle,
      .unicorn-sparkle,
      .window::before,
      body::before {
        animation: none;
      }
    }
  </style>
</head>

<body>

  <div class="magic-cursor" id="magic-cursor" aria-hidden="true"></div>

  <script>
    const code = document.getElementById("code");

    const parts = [
      ["class", "kw"], [" ", ""], ["Profile", "name"], [":\n\n", ""],
      ["  def", "kw"], [" ", ""], ["__init__", "name"], ["(self):\n", ""],
      ["    self.name = ", ""], ['"Yuka Ito"', "str"], ["\n", ""],
      ["    self.birth_date = ", ""], ['"2008/7/18"', "str"], ["\n", ""],
      ["    self.blood_type = ", ""], ['"O"', "str"], ["\n", ""],
      ["    self.other = [\n", ""],
      ["      ", ""], ['"未踏ジュニア2026"', "str"], ["\n", ""],
      ["      ", ""], ['"情報科学の達人6期生"', "str"], ["\n", ""],
      ["    ]\n\n", ""],
      ["me = Profile()", ""]
    ];

    const cursor = document.createElement("span");
    cursor.className = "cursor";

    let partIndex = 0;
    let charIndex = 0;
    let currentSpan = null;

    function makeSpan(className) {
      const span = document.createElement("span");
      span.className = className || "plain";
      code.insertBefore(span, cursor);
      return span;
    }

    function typeCode() {
      if (!cursor.parentNode) code.appendChild(cursor);

      if (partIndex >= parts.length) return;

      const text = parts[partIndex][0];
      const className = parts[partIndex][1];

      if (!currentSpan) currentSpan = makeSpan(className);

      currentSpan.textContent += text[charIndex];
      charIndex += 1;

      if (charIndex >= text.length) {
        partIndex += 1;
        charIndex = 0;
        currentSpan = null;
      }

      const delay = text[charIndex - 1] === "\n" ? 90 : 22;
      setTimeout(typeCode, delay);
    }

    setTimeout(typeCode, 1250);

    const magicCursor = document.getElementById("magic-cursor");
    const finePointer = window.matchMedia("(hover: hover) and (pointer: fine)").matches;
    const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const sparkleColors = ["#ff8ed4", "#b895ff", "#8bdfff", "#72eadb", "#ffe57d"];

    function randomBetween(min, max) {
      return min + Math.random() * (max - min);
    }

    function clamp(value, min, max) {
      return Math.min(Math.max(value, min), max);
    }

    function makeSparkle(className, x, y, options = {}) {
      const sparkle = document.createElement("span");
      sparkle.className = className;
      sparkle.style.left = `${x}px`;
      sparkle.style.top = `${y}px`;
      sparkle.style.setProperty("--spark-color", options.color || sparkleColors[Math.floor(Math.random() * sparkleColors.length)]);
      sparkle.style.setProperty("--spark-size", `${options.size || randomBetween(8, 16)}px`);
      sparkle.style.setProperty("--spark-x", `${options.driftX ?? randomBetween(-28, 22)}px`);
      sparkle.style.setProperty("--spark-y", `${options.driftY ?? randomBetween(-36, -12)}px`);
      sparkle.style.setProperty("--spark-spin", `${options.spin || randomBetween(90, 240)}deg`);
      document.body.appendChild(sparkle);
      setTimeout(() => sparkle.remove(), options.life || 1500);
    }

    const unicorn = document.querySelector(".unicorn");
    const wanderPoints = [
      [0.73, 0.10],
      [0.18, 0.20],
      [0.66, 0.34],
      [0.84, 0.62],
      [0.48, 0.78],
      [0.12, 0.66],
      [0.30, 0.38]
    ];

    let wanderIndex = 0;
    let lastUnicornSparkle = 0;

    function setUnicornPosition(x, y, duration, tilt, face, scale = 1) {
      unicorn.style.setProperty("--x", `${x}px`);
      unicorn.style.setProperty("--y", `${y}px`);
      unicorn.style.setProperty("--tilt", `${tilt}deg`);
      unicorn.style.setProperty("--face", face);
      unicorn.style.setProperty("--scale", scale.toFixed(2));
      unicorn.style.setProperty("--move-duration", `${duration}ms`);
      unicorn.dataset.x = String(x);
      unicorn.dataset.y = String(y);
      unicorn.dataset.facing = face === "-1" ? "right" : "left";
    }

    function moveUnicorn() {
      if (!unicorn || reducedMotion) return;

      const rect = unicorn.getBoundingClientRect();
      const width = rect.width || 150;
      const height = rect.height || 92;
      const pad = Math.max(16, Math.min(window.innerWidth, window.innerHeight) * 0.035);
      const point = wanderPoints[wanderIndex % wanderPoints.length];
      const jitterX = randomBetween(-window.innerWidth * 0.07, window.innerWidth * 0.07);
      const jitterY = randomBetween(-window.innerHeight * 0.08, window.innerHeight * 0.08);
      const previousX = Number(unicorn.dataset.x || window.innerWidth * 0.7);
      const previousY = Number(unicorn.dataset.y || window.innerHeight * 0.12);
      const nextX = clamp(point[0] * window.innerWidth + jitterX, pad, window.innerWidth - width - pad);
      const nextY = clamp(point[1] * window.innerHeight + jitterY, pad, window.innerHeight - height - pad);
      const dx = nextX - previousX;
      const dy = nextY - previousY;
      const distance = Math.hypot(dx, dy);
      const duration = Math.round(clamp(distance * 8.8 + randomBetween(1800, 2800), 4200, 8200));
      const tilt = clamp(dy * 0.06, -10, 10);
      const scale = randomBetween(0.96, 1.07);
      const face = dx > 4 ? "-1" : "1";

      setUnicornPosition(nextX, nextY, duration, tilt, face, scale);
      wanderIndex = (wanderIndex + 1 + Math.floor(Math.random() * 2)) % wanderPoints.length;
      setTimeout(moveUnicorn, duration * randomBetween(0.96, 1.32));
    }

    function startUnicorn() {
      if (!unicorn || reducedMotion) return;

      const rect = unicorn.getBoundingClientRect();
      const startX = clamp(window.innerWidth * 0.72, 16, window.innerWidth - rect.width - 16);
      const startY = clamp(window.innerHeight * 0.12, 16, window.innerHeight - rect.height - 16);
      unicorn.style.transitionDuration = "0ms";
      setUnicornPosition(startX, startY, 0, -5, "1", 1);
      requestAnimationFrame(() => {
        unicorn.style.transitionDuration = "";
        setTimeout(moveUnicorn, 500);
      });

      requestAnimationFrame(function sparkleLoop(now) {
        const currentRect = unicorn.getBoundingClientRect();
        if (now - lastUnicornSparkle > 118 && currentRect.width > 0) {
          lastUnicornSparkle = now;
          const facingRight = unicorn.dataset.facing === "right";
          const tailX = currentRect.left + currentRect.width * (facingRight ? 0.18 : 0.82);
          const tailY = currentRect.top + currentRect.height * randomBetween(0.38, 0.62);
          const driftDirection = facingRight ? -1 : 1;
          for (let i = 0; i < 2; i += 1) {
            makeSparkle("unicorn-sparkle", tailX + randomBetween(-16, 12), tailY + randomBetween(-16, 12), {
              driftX: randomBetween(24, 72) * driftDirection,
              driftY: randomBetween(-34, 22),
              size: randomBetween(7, 18),
              life: randomBetween(1120, 1560)
            });
          }
        }
        requestAnimationFrame(sparkleLoop);
      });
    }

    startUnicorn();

    if (finePointer && magicCursor) {
      let lastTrail = 0;

      document.addEventListener("pointermove", (event) => {
        magicCursor.style.opacity = "1";
        magicCursor.style.left = `${event.clientX}px`;
        magicCursor.style.top = `${event.clientY}px`;

        const now = performance.now();
        if (!reducedMotion && now - lastTrail > 34) {
          lastTrail = now;
          makeSparkle("cursor-sparkle", event.clientX + randomBetween(-4, 11), event.clientY + randomBetween(8, 20), {
            driftX: randomBetween(-26, 18),
            driftY: randomBetween(-28, -8),
            size: randomBetween(7, 13),
            life: 840
          });
        }
      });

      window.addEventListener("blur", () => {
        magicCursor.style.opacity = "0";
      });
    }
  </script>
</body>
</html>
