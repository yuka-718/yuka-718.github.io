<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <title>Yuka Ito</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f5f5f8;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      color: #111;
      overflow: hidden;
    }

    .stage {
      width: min(1180px, 88vw);
      min-height: 620px;
      display: grid;
      place-items: center;
      background: #bff8ff;
      padding: 70px;
      box-sizing: border-box;
      transform: scaleX(0.04) scaleY(0.02);
      animation: openStage 900ms cubic-bezier(.2, .9, .2, 1) forwards;
    }

    .window {
      width: 100%;
      max-width: 980px;
      background: #ffb6e6;
      border-radius: 28px;
      padding: 22px;
      box-sizing: border-box;
      opacity: 0;
      transform: translateY(30px) scale(.92);
      animation: popWindow 700ms cubic-bezier(.2, .9, .2, 1) 650ms forwards;
    }

    .dots {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
    }

    .dot {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      animation: bounce 1.4s ease-in-out infinite;
    }

    .dot:nth-child(2) { animation-delay: .15s; }
    .dot:nth-child(3) { animation-delay: .3s; }

    .pink { background: #ff1aaa; }
    .yellow { background: #ffdc4d; }
    .blue { background: #49d8df; }

    .code {
      min-height: 400px;
      background: white;
      border-radius: 28px;
      padding: 18px;
      font-size: clamp(18px, 3vw, 34px);
      line-height: 1.35;
      white-space: pre-wrap;
      overflow-x: auto;
    }

    .kw { color: #4f75ff; }
    .name { color: #ff741f; }
    .str { color: #24ee83; }

    .cursor {
      display: inline-block;
      width: .55em;
      height: 1em;
      background: #111;
      vertical-align: -0.12em;
      animation: blink .75s steps(1) infinite;
    }

    @keyframes openStage {
      0% { transform: scaleX(0.04) scaleY(0.02); border-radius: 999px; }
      55% { transform: scaleX(1) scaleY(0.04); border-radius: 999px; }
      100% { transform: scaleX(1) scaleY(1); border-radius: 0; }
    }

    @keyframes popWindow {
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-7px); }
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    @media (max-width: 700px) {
      body { overflow: auto; }

      .stage {
        width: 100vw;
        min-height: 100vh;
        padding: 26px;
      }

      .window {
        border-radius: 22px;
        padding: 16px;
      }

      .dot {
        width: 18px;
        height: 18px;
      }

      .code {
        min-height: 360px;
        border-radius: 20px;
        padding: 14px;
      }
    }
  </style>
</head>
<body>
  <main class="stage">
    <section class="window">
      <div class="dots">
        <span class="dot pink"></span>
        <span class="dot yellow"></span>
        <span class="dot blue"></span>
      </div>

      <pre class="code" id="code"></pre>
    </section>
  </main>

  <script>
    const code = `<span class="kw">class</span> <span class="name">Profile</span>:

  <span class="kw">def</span> <span class="name">__init__</span>(self):
    self.name = <span class="str">"Yuka Ito"</span>
    self.birth_date = <span class="str">"2008/7/18"</span>
    self.blood_type = <span class="str">"O"</span>
    self.other = [
      <span class="str">"未踏ジュニア2026"</span>
      <span class="str">"情報科学の達人6期生"</span>
    ]

me = Profile()`;

    const el = document.getElementById("code");
    let i = 0;

    function type() {
      el.innerHTML = code.slice(0, i) + '<span class="cursor"></span>';
      i += 3;
      if (i <= code.length) requestAnimationFrame(type);
      else el.innerHTML = code + '<span class="cursor"></span>';
    }

    setTimeout(type, 1200);
  </script>
</body>
</html>
